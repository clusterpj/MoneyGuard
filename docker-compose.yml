services:
  postgres:
    image: postgres:16-alpine
    container_name: moneyguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Pl3T0r@x
      POSTGRES_DB: moneyguard
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneyguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moneyguard-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneyguard-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:Pl3T0r@x@postgres:5432/moneyguard
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - moneyguard-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local

networks:
  moneyguard-network:
    driver: bridge
